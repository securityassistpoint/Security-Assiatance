<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3d1477">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SCB Security Assistance Point</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #3d1477;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background: #3d1477;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      width: min(100vw, calc(100dvh * 711 / 1536));
      height: min(100dvh, calc(100vw * 1536 / 711));
      aspect-ratio: 711 / 1536;
      flex: 0 0 auto;
      overflow: hidden;
      background: #3d1477;
    }

    .artwork {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .emergency-button {
      position: absolute;
      left: 33.473980%;
      top: 32.552083%;
      width: 33.192686%;
      height: 15.364583%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      transform-origin: center;
      animation: pulseMove 1.55s ease-in-out infinite;
      will-change: transform, filter;
      -webkit-touch-callout: none;
    }

    .emergency-button img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
      clip-path: circle(46% at 50% 50%);
    }

    .emergency-button::before,
    .emergency-button::after {
      content: "";
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      pointer-events: none;
    }

    .emergency-button::before {
      border: 2px solid rgba(255,255,255,.72);
      animation: ring 1.55s ease-out infinite;
    }

    .emergency-button::after {
      inset: 14%;
      box-shadow: 0 0 28px rgba(255, 46, 55, .65);
      animation: glow 1.55s ease-in-out infinite;
    }

    .emergency-button:active {
      animation-play-state: paused;
      transform: scale(.92);
      filter: brightness(.92);
    }

    @keyframes pulseMove {
      0%, 100% { transform: scale(1) translateY(0); }
      42% { transform: scale(1.055) translateY(-2px); }
      56% { transform: scale(1.035) rotate(-1deg); }
      68% { transform: scale(1.045) rotate(1deg); }
      80% { transform: scale(1.02) rotate(0); }
    }

    @keyframes ring {
      0% { transform: scale(.88); opacity: .75; }
      70% { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    @keyframes glow {
      0%, 100% { opacity: .35; }
      50% { opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .emergency-button,
      .emergency-button::before,
      .emergency-button::after {
        animation: none;
      }
    }


    .live-date-panel {
      position: absolute;
      left: 29.5%;
      top: 88.25%;
      width: 62%;
      height: 9.6%;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      color: #fff;
      pointer-events: none;
    }

    .live-date-panel::before {
      content: "";
      position: absolute;
      inset: -2% -2% -3% -3%;
      background:
        radial-gradient(circle at 35% 30%, rgba(111, 54, 168, .34), transparent 52%),
        linear-gradient(180deg, rgba(69, 25, 126, .96), rgba(58, 19, 111, .97));
      border-radius: 12px;
      z-index: -1;
    }

    .live-date {
      width: 100%;
      font-size: clamp(12px, 3.55vw, 26px);
      line-height: 1.2;
      font-weight: 400;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.24);
    }

    .live-time {
      width: 100%;
      margin-top: 2.5%;
      display: flex;
      align-items: baseline;
      gap: .04em;
      font-variant-numeric: tabular-nums;
      line-height: .9;
      text-shadow: 0 2px 5px rgba(0,0,0,.28);
    }

    .live-time .hm {
      font-size: clamp(28px, 9.2vw, 64px);
      font-weight: 400;
      letter-spacing: -.035em;
    }

    .live-time .sec {
      font-size: clamp(17px, 5.2vw, 36px);
      font-weight: 400;
      letter-spacing: -.02em;
    }

    @media (max-height: 700px) {
      .live-date-panel {
        top: 88%;
      }
    }

  </style>
</head>

  <script>
    function updateLiveClock() {
      const now = new Date();

      const dateText = new Intl.DateTimeFormat("th-TH", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(now);

      const hm = new Intl.DateTimeFormat("th-TH", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(now);

      const sec = new Intl.DateTimeFormat("th-TH", {
        second: "2-digit"
      }).format(now);

      document.getElementById("liveDate").textContent = dateText;
      document.getElementById("liveHM").textContent = hm;
      document.getElementById("liveSEC").textContent = ":" + sec;
    }

    updateLiveClock();
    setInterval(updateLiveClock, 1000);
  </script>

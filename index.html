<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#05000d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SCB Security Assistance Point</title>

  <style>
    :root {
      --design-w: 711;
      --design-h: 1536;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05000d;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Tahoma, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      overflow: hidden;
      background: #05000d;
      isolation: isolate;
    }

    .mockup {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
    }

    .live-strip {
      position: absolute;
      left: 6.10%;
      top: 25.28%;
      width: 87.80%;
      height: 7.05%;
      z-index: 5;
      border-radius: clamp(18px, 4.7vw, 34px);
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      padding: 0 5.3%;
      color: #fff;
      overflow: hidden;
      border: 1px solid rgba(195, 126, 255, .48);
      background:
        radial-gradient(circle at 20% 0%, rgba(182, 102, 255, .17), transparent 42%),
        linear-gradient(145deg, rgba(30, 12, 64, .97), rgba(9, 3, 27, .98));
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.17),
        inset 0 -1px 0 rgba(118,44,218,.18),
        0 8px 24px rgba(0,0,0,.34),
        0 0 22px rgba(117,43,232,.15);
    }

    .live-strip::after {
      content: "";
      position: absolute;
      top: -120%;
      left: -38%;
      width: 27%;
      height: 340%;
      transform: rotate(24deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.17), transparent);
      animation: sweep 7s ease-in-out infinite;
      pointer-events: none;
    }

    .online {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 1.8vw, 12px);
      min-width: 0;
      position: relative;
      z-index: 2;
    }

    .dot {
      position: relative;
      width: clamp(10px, 2.8vw, 19px);
      aspect-ratio: 1;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #26e69b;
      box-shadow:
        0 0 0 4px rgba(38,230,155,.10),
        0 0 15px rgba(38,230,155,.76);
    }

    .dot::after {
      content: "";
      position: absolute;
      inset: -42%;
      border: 1px solid rgba(38,230,155,.65);
      border-radius: inherit;
      opacity: 0;
    }

    .dot.tick {
      animation: beat .62s ease-out;
    }

    .dot.tick::after {
      animation: ring .85s ease-out;
    }

    .online-copy {
      min-width: 0;
      text-align: left;
      white-space: nowrap;
    }

    .online-title {
      font-size: clamp(11px, 3.25vw, 22px);
      font-weight: 500;
      line-height: 1;
      color: #54f0ae;
    }

    .online-sub {
      margin-top: clamp(5px, 1.25vw, 9px);
      font-size: clamp(7px, 1.65vw, 12px);
      color: rgba(255,255,255,.88);
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 55%;
      justify-self: center;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,.60), transparent);
    }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .clock-time {
      font-size: clamp(20px, 5.4vw, 38px);
      font-weight: 560;
      line-height: .94;
      letter-spacing: .015em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 13px rgba(180,115,255,.25);
    }

    .clock-sec {
      color: #f0e3ff;
    }

    .clock-date {
      margin-top: clamp(6px, 1.35vw, 10px);
      font-size: clamp(7px, 1.66vw, 12px);
      font-weight: 500;
      color: rgba(255,255,255,.88);
      white-space: nowrap;
    }

    .phone-hotspot {
      position: absolute;
      left: 30.8%;
      top: 39.35%;
      width: 38.4%;
      height: 19.1%;
      z-index: 7;
      border-radius: 48%;
      text-decoration: none;
      touch-action: manipulation;
    }

    .phone-hotspot:active {
      transform: scale(.975);
    }



    /* Ultra Premium Apple-style 3D Liquid Glass phone button */
    .phone-icon-3d {
      position: absolute;
      left: 39.15%;
      top: 39.10%;
      width: 21.7%;
      aspect-ratio: 1;
      z-index: 9;
      border-radius: 50%;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: #fff;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 29% 18%,
          rgba(255,255,255,.72) 0 7%,
          rgba(255,255,255,.20) 18%,
          transparent 32%),
        linear-gradient(145deg,
          rgba(255,117,130,.98) 0%,
          rgba(239,41,69,.995) 50%,
          rgba(145,0,34,.998) 100%);
      border: 1px solid rgba(255,255,255,.58);
      -webkit-backdrop-filter: blur(28px) saturate(185%);
      backdrop-filter: blur(28px) saturate(185%);
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.68),
        inset 0 -12px 24px rgba(91,0,21,.38),
        inset 0 0 0 1px rgba(255,255,255,.10),
        0 4px 0 rgba(96,0,23,.72),
        0 13px 26px rgba(0,0,0,.45),
        0 0 24px rgba(255,54,78,.34);
      transform:
        perspective(520px)
        rotateX(5deg)
        translateZ(0);
      animation:
        phoneFloat 4.2s ease-in-out infinite,
        phoneShake 8s ease-in-out infinite;
      transition:
        transform .18s ease,
        filter .18s ease,
        box-shadow .18s ease;
    }

    .phone-icon-3d::before {
      content: "";
      position: absolute;
      inset: 5.5%;
      z-index: -1;
      border-radius: inherit;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,.30) 0%,
          rgba(255,255,255,.08) 26%,
          transparent 48% 72%,
          rgba(255,255,255,.06) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.14),
        inset 0 -8px 18px rgba(79,0,19,.18);
    }

    .phone-icon-3d::after {
      content: "";
      position: absolute;
      top: -105%;
      left: -58%;
      width: 36%;
      height: 310%;
      transform: rotate(26deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.62),
        transparent
      );
      filter: blur(.4px);
      animation: phoneShimmer 6.2s ease-in-out infinite;
    }

    .phone-icon-3d svg {
      width: 46%;
      height: 46%;
      position: relative;
      z-index: 2;
      filter:
        drop-shadow(0 3px 3px rgba(78,0,15,.48))
        drop-shadow(0 0 8px rgba(255,255,255,.20));
      transform: rotate(-7deg);
    }

    .phone-hotspot:active + .phone-icon-3d,
    .phone-icon-3d:active {
      transform:
        perspective(520px)
        rotateX(0deg)
        translateY(3px)
        scale(.95);
      filter: saturate(1.08);
      box-shadow:
        inset 0 4px 11px rgba(91,0,22,.45),
        inset 0 -2px 2px rgba(255,255,255,.28),
        0 2px 7px rgba(0,0,0,.42),
        0 0 18px rgba(255,54,78,.26);
    }



    .service {
      position: absolute;
      z-index: 7;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .s1 { left: 6.0%;  top: 62.05%; width: 28.0%; height: 15.15%; }
    .s2 { left: 36.0%; top: 62.05%; width: 28.0%; height: 15.15%; }
    .s3 { left: 66.0%; top: 62.05%; width: 28.0%; height: 15.15%; }
    .s4 { left: 6.0%;  top: 78.00%; width: 28.0%; height: 14.55%; }
    .s5 { left: 36.0%; top: 78.00%; width: 28.0%; height: 14.55%; }
    .s6 { left: 66.0%; top: 78.00%; width: 28.0%; height: 14.55%; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));
      transform: translate(-50%, 18px);
      width: min(88vw, 430px);
      padding: 13px 16px;
      border-radius: 18px;
      color: #fff;
      text-align: center;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,.17);
      background: rgba(18, 6, 42, .94);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      box-shadow: 0 16px 38px rgba(0,0,0,.44);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes beat {
      0% { transform: scale(.84); }
      42% { transform: scale(1.24); }
      100% { transform: scale(1); }
    }

    @keyframes ring {
      0% { transform: scale(.5); opacity: .82; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    @keyframes sweep {
      0%, 72% { transform: translateX(-20%) rotate(24deg); opacity: 0; }
      79% { opacity: .82; }
      93% { transform: translateX(520%) rotate(24deg); opacity: 0; }
      100% { transform: translateX(520%) rotate(24deg); opacity: 0; }
    }


    @keyframes phoneFloat {
      0%, 100% {
        translate: 0 0;
        filter: brightness(1);
      }
      50% {
        translate: 0 -3px;
        filter: brightness(1.035);
      }
    }

    @keyframes phoneShake {
      0%, 84%, 100% { rotate: 0deg; }
      86% { rotate: -5deg; }
      88% { rotate: 5deg; }
      90% { rotate: -4deg; }
      92% { rotate: 3deg; }
      94% { rotate: 0deg; }
    }


    @keyframes phoneShimmer {
      0%, 72% {
        transform: translateX(-35%) rotate(26deg);
        opacity: 0;
      }
      78% { opacity: .92; }
      91% {
        transform: translateX(520%) rotate(26deg);
        opacity: 0;
      }
      100% {
        transform: translateX(520%) rotate(26deg);
        opacity: 0;
      }
    }


    @supports not (height: 100dvh) {
      .viewport {
        height: 100vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

    <button class="service s3" aria-label="Fire Alarm" onclick="showToast('เหตุเพลิงไหม้หรือสัญญาณเตือน กรุณาโทรแจ้งทันที')"></button>
    <button class="service s4" aria-label="Parking Assistance" onclick="showToast('ปัญหาเร่งด่วนในลานจอด กรุณาโทรแจ้งทันที')"></button>
    <button class="service s5" aria-label="Suspicious Person" onclick="showToast('พบบุคคลต้องสงสัย กรุณาโทรแจ้งทันที')"></button>
    <button class="service s6" aria-label="Building Information" onclick="showToast('ข้อมูลอาคารและพื้นที่อยู่ระหว่างจัดเตรียม')"></button>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    let lastSecond = null;
    let toastTimer;

    function updateClock() {
      const now = new Date();

      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Bangkok',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).formatToParts(now);

      const values = Object.fromEntries(
        parts
          .filter(part => part.type !== 'literal')
          .map(part => [part.type, part.value])
      );

      document.getElementById('clockHM').textContent =
        `${values.hour}:${values.minute}`;

      document.getElementById('clockSec').textContent =
        `:${values.second}`;

      document.getElementById('clockDate').textContent =
        new Intl.DateTimeFormat('th-TH', {
          timeZone: 'Asia/Bangkok',
          weekday: 'short',
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        }).format(now).replace(/,/g, '');

      if (values.second !== lastSecond) {
        const dot = document.getElementById('statusDot');
        dot.classList.remove('tick');
        void dot.offsetWidth;
        dot.classList.add('tick');
        lastSecond = values.second;
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    updateClock();
    setInterval(updateClock, 250);
  </script>
</body>
</html>

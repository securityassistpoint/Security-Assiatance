<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090017" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SCB Security Assistance Point</title>

  <style>
    :root {
      --bg: #05000f;
      --max-width: 725px;
      --edge-bleed: 2px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      position: relative;
      width: 100dvw;
      max-width: var(--max-width);
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      background: #080016;
      overflow: hidden;
      isolation: isolate;
    }

    .mockup {
      display: block;
      width: calc(100% + (var(--edge-bleed) * 2));
      max-width: none;
      height: auto;
      margin-left: calc(var(--edge-bleed) * -1);
      margin-right: calc(var(--edge-bleed) * -1);
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Transparent hotspots keep the screenshot 100% visually identical */
    .hotspot {
      position: absolute;
      display: block;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(255, 214, 92, .95);
      outline-offset: -3px;
      border-radius: 22px;
    }

    .call {
      left: 5.2%;
      top: 40.4%;
      width: 89.6%;
      height: 11.2%;
      border-radius: 34px;
    }

    .card-security { left: 5.0%; top: 53.5%; width: 29.3%; height: 14.3%; }
    .card-medical  { left: 35.3%; top: 53.5%; width: 29.3%; height: 14.3%; }
    .card-fire     { left: 65.7%; top: 53.5%; width: 29.3%; height: 14.3%; }
    .card-parking  { left: 5.0%; top: 68.5%; width: 29.3%; height: 14.3%; }
    .card-person   { left: 35.3%; top: 68.5%; width: 29.3%; height: 14.3%; }
    .card-building { left: 65.7%; top: 68.5%; width: 29.3%; height: 14.3%; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      width: min(88vw, 560px);
      padding: 13px 16px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      color: white;
      background: rgba(20, 7, 42, .88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      text-align: center;
      font-size: 14px;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 726px) {
      body {
        padding: 20px 0;
        background:
          radial-gradient(circle at 50% 10%, rgba(102, 0, 255, .18), transparent 34%),
          var(--bg);
      }

      .app {
        width: min(100%, var(--max-width));
        border-radius: 28px;
        box-shadow: 0 0 60px rgba(94, 28, 255, .22);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast { transition: none; }
    }
  </style>
</head>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer;

    function showMessage(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }
  </script>

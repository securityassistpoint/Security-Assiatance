<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2D1653">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SCB Security Assistance Point</title>

  <style>
    :root {
      --scb-purple: #4E2A84;
      --scb-purple-dark: #2D1653;
      --scb-purple-deep: #11071D;
      --scb-purple-light: #7A52B3;
      --scb-gold: #F4B728;
      --scb-gold-soft: #FFD86E;
      --white: #FFFFFF;
      --muted: #D8CDE7;
      --green: #3FE69A;
      --line: rgba(255,255,255,.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Arial, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 8% 5%, rgba(122,82,179,.28), transparent 28%),
        radial-gradient(circle at 92% 18%, rgba(244,183,40,.10), transparent 22%),
        linear-gradient(160deg, #09040F, #160923 48%, var(--scb-purple-dark));
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
    }

    a, button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      height: 100dvh;
      padding:
        max(4px, env(safe-area-inset-top))
        5px
        max(6px, env(safe-area-inset-bottom));
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
    }

    .app {
      width: min(100%, 500px);
      height: 100%;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.16);
      background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
      box-shadow:
        0 18px 50px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.20);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      display: grid;
      grid-template-rows: auto minmax(0, 1.22fr) auto minmax(0, 1fr);
      position: relative;
    }

    .header {
      min-height: 64px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(90deg, rgba(78,42,132,.94), rgba(45,22,83,.88));
      border-bottom: 1px solid rgba(255,255,255,.10);
      position: relative;
      z-index: 4;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .logo-img {
      width: 140px;
      max-width: 49vw;
      height: 44px;
      object-fit: contain;
      object-position: left center;
      border-radius: 8px;
      background: var(--scb-purple);
      flex: 0 1 auto;
    }

    .status {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 999px;
      border: 1px solid rgba(154,94,242,.44);
      background: rgba(8,3,15,.58);
      font-size: 9px;
      font-weight: 850;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 13px rgba(63,230,154,.95);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .hero {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #12071F;
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 50% 42%, rgba(78,42,132,.03), transparent 40%),
        linear-gradient(90deg, rgba(5,2,10,.18), transparent 22%, transparent 78%, rgba(5,2,10,.18));
      pointer-events: none;
    }

    .hero-copy {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      z-index: 3;
      text-shadow: 0 4px 18px rgba(0,0,0,.72);
    }

    .hero-copy h1 {
      margin: 0;
      font-size: clamp(29px, 8.9vw, 44px);
      line-height: .90;
      letter-spacing: .1px;
    }

    .hero-copy h1 span {
      display: block;
      margin-top: 6px;
      color: var(--scb-gold);
      font-size: .68em;
      letter-spacing: 1px;
    }

    .hero-copy .th {
      margin: 10px 0 1px;
      font-size: 13px;
      font-weight: 900;
    }

    .hero-copy .en {
      margin: 0;
      font-size: 7.5px;
      color: #E7DDF1;
      letter-spacing: .7px;
    }

    .call-area {
      padding: 8px 9px;
      background: linear-gradient(180deg, rgba(11,6,18,.45), rgba(11,6,18,.70));
    }

    .call {
      min-height: 76px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 21px;
      color: #29113E;
      background: linear-gradient(135deg, #FFF2BD, var(--scb-gold) 52%, #E39D08);
      border: 1px solid rgba(255,255,255,.58);
      box-shadow:
        0 16px 32px rgba(244,183,40,.28),
        0 0 22px rgba(244,183,40,.12),
        inset 0 1px 0 rgba(255,255,255,.92);
      position: relative;
      overflow: hidden;
      animation: callGlow 2.6s ease-in-out infinite;
    }

    .call::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 28%, rgba(255,255,255,.76), transparent 65%);
      transform: translateX(-140%);
      animation: sweep 3.5s ease-in-out infinite;
    }

    .call-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 27px;
      background: linear-gradient(145deg, #6A35AC, #2B124A);
      border: 2px solid rgba(255,255,255,.36);
      box-shadow: 0 10px 22px rgba(41,13,73,.36), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .call-copy {
      min-width: 0;
      flex: 1;
    }

    .call-copy strong {
      display: block;
      font-size: clamp(19px, 5.7vw, 26px);
      line-height: 1.03;
      white-space: nowrap;
      letter-spacing: -.3px;
    }

    .call-copy span {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      font-weight: 850;
    }

    .call-copy small {
      display: block;
      margin-top: 3px;
      font-size: 7px;
      color: #5B2E00;
    }

    .call-arrow {
      flex: 0 0 auto;
      font-size: 24px;
      font-weight: 900;
    }

    .content {
      min-height: 0;
      padding: 0 9px 9px;
      overflow: hidden;
    }

    .grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      grid-template-rows: repeat(2, minmax(0,1fr));
      gap: 6px;
    }

    .card {
      min-width: 0;
      min-height: 0;
      padding: 6px 3px 5px;
      border: 1px solid rgba(169,91,255,.50);
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(145deg, rgba(96,45,155,.48), rgba(20,8,34,.78));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        0 7px 16px rgba(0,0,0,.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card:active {
      transform: scale(.98);
    }

    .card-icon {
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1;
      margin-bottom: 4px;
      filter: drop-shadow(0 6px 9px rgba(0,0,0,.28));
    }

    .card strong {
      font-size: clamp(8.4px, 2.6vw, 10.5px);
      line-height: 1.1;
    }

    .card span {
      margin-top: 4px;
      font-size: clamp(6.3px, 2vw, 7.6px);
      line-height: 1.2;
      color: var(--muted);
    }

    .card i {
      width: 18px;
      height: 18px;
      margin-top: 4px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.25);
      font-style: normal;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(18px);
      padding: 10px 13px;
      border-radius: 999px;
      background: rgba(9,4,16,.95);
      border: 1px solid rgba(169,91,255,.45);
      transition: .25s ease;
      font-size: 10px;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 360px) {
      .header {
        min-height: 58px;
        padding: 7px 8px;
      }

      .logo-img {
        width: 118px;
        height: 39px;
      }

      .status {
        padding: 6px 8px;
        font-size: 8px;
      }

      .hero-copy h1 {
        font-size: 28px;
      }

      .hero-copy .th {
        font-size: 12px;
      }

      .call {
        min-height: 70px;
        padding: 8px 9px;
        gap: 7px;
      }

      .call-icon {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }

      .call-copy strong {
        font-size: 18px;
      }

      .call-copy span {
        font-size: 7.2px;
      }

      .call-copy small {
        font-size: 6.4px;
      }

      .grid {
        gap: 5px;
      }
    }

    @media (max-height: 700px) {
      .app {
        grid-template-rows: auto minmax(0, 1.08fr) auto minmax(0, .95fr);
      }

      .hero-copy h1 {
        font-size: 27px;
      }

      .hero-copy .th {
        font-size: 11px;
        margin-top: 7px;
      }

      .call {
        min-height: 66px;
      }

      .call-icon {
        width: 46px;
        height: 46px;
        font-size: 22px;
      }

      .call-copy strong {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: .72; }
    }

    @keyframes callGlow {
      0%,100% {
        box-shadow:
          0 16px 32px rgba(244,183,40,.27),
          0 0 18px rgba(244,183,40,.12),
          inset 0 1px 0 rgba(255,255,255,.92);
      }
      50% {
        box-shadow:
          0 19px 39px rgba(244,183,40,.41),
          0 0 28px rgba(244,183,40,.18),
          inset 0 1px 0 rgba(255,255,255,.96);
      }
    }

    @keyframes sweep {
      0%,64% { transform: translateX(-140%); }
      84%,100% { transform: translateX(140%); }
    }
  
    /* ===== Live Clock ===== */
    .header-tools{
      display:flex;
      align-items:center;
      gap:6px;
      flex:0 0 auto;
    }

    .live-clock{
      min-width:78px;
      padding:6px 8px;
      border-radius:14px;
      text-align:center;
      background:rgba(8,3,15,.58);
      border:1px solid rgba(154,94,242,.44);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
      font-variant-numeric:tabular-nums;
      line-height:1.05;
    }

    .live-clock .time{
      display:block;
      font-size:11px;
      font-weight:900;
      letter-spacing:.45px;
    }

    .live-clock .date{
      display:block;
      margin-top:3px;
      color:#D8CDE7;
      font-size:6.7px;
      letter-spacing:.35px;
      white-space:nowrap;
    }

    @media (max-width:390px){
      .header{gap:6px}
      .header-tools{gap:4px}
      .status{padding:6px 7px;font-size:7.5px}
      .live-clock{min-width:68px;padding:5px 6px;border-radius:12px}
      .live-clock .time{font-size:10px}
      .live-clock .date{font-size:5.8px}
      .logo-img{max-width:42vw}
    }

    @media (max-width:340px){
      .status{display:none}
      .live-clock{min-width:72px}
      .logo-img{max-width:54vw}
    }

  </style>
</head>

          <button class="card" data-msg="แจ้งบุคคลต้องสงสัยหรือเหตุผิดปกติ">
            <div class="card-icon">🕵️</div>
            <strong>SUSPICIOUS<br>PERSON</strong>
            <span>บุคคลต้องสงสัย<br>หรือเหตุผิดปกติ</span>
            <i>›</i>
          </button>

          <button class="card" id="shareLocation">
            <div class="card-icon">📍</div>
            <strong>SHARE<br>LOCATION</strong>
            <span>แชร์ตำแหน่ง<br>ของคุณ</span>
            <i>›</i>
          </button>

        </div>
      </section>

    </section>
  </main>

  <div class="toast" id="toast">พร้อมให้ความช่วยเหลือ</div>

  <script>
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.__toast);
      window.__toast = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.querySelectorAll("[data-msg]").forEach(el => {
      el.addEventListener("click", () => showToast(el.dataset.msg));
    });

    async function shareLocation() {
      if (!navigator.geolocation) {
        showToast("อุปกรณ์นี้ไม่รองรับตำแหน่ง");
        return;
      }

      showToast("กำลังค้นหาตำแหน่ง...");

      navigator.geolocation.getCurrentPosition(async p => {
        const url = `https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;

        try {
          if (navigator.share) {
            await navigator.share({
              title: "Emergency Location",
              text: "ตำแหน่งปัจจุบันสำหรับขอความช่วยเหลือ",
              url
            });
          } else {
            await navigator.clipboard.writeText(url);
            showToast("คัดลอกลิงก์ตำแหน่งแล้ว");
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            showToast("ไม่สามารถแชร์ตำแหน่งได้");
          }
        }
      }, () => {
        showToast("กรุณาอนุญาตการเข้าถึงตำแหน่ง");
      }, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    }

    document.getElementById("shareLocation").addEventListener("click", shareLocation);
  
    function updateClock(){
      const now = new Date();

      document.getElementById("currentTime").textContent =
        now.toLocaleTimeString("th-TH", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

      document.getElementById("currentDate").textContent =
        now.toLocaleDateString("en-GB", {
          weekday: "short",
          day: "2-digit",
          month: "short",
          year: "numeric"
        }).toUpperCase();
    }

    updateClock();
    setInterval(updateClock, 1000);

  </script>
</body>
</html>
